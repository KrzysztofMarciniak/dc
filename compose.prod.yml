services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - app-data:/data
      - ./.env:/data/.env:ro
      - ./templates:/data/templates:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    restart: always

volumes:
  app-data:
