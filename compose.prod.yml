services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "8080"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html
    restart: always
